

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Listing Details - OneOfTwo</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      font-family: Arial, Helvetica, sans-serif;

      background: #0f172a;

      color: white;

    }

    header {

      background: #020617;

      padding: 24px;

    }

    .logo {

      color: white;

      font-size: 28px;

      font-weight: bold;

      text-decoration: none;

    }

    main {

      max-width: 1100px;

      margin: auto;

      padding: 30px 20px;

    }

    a {

      color: #93c5fd;

    }

    .back {

      display: inline-block;

      margin-bottom: 25px;

    }

    h1 {

      font-size: 36px;
      overflow-wrap: anywhere;

      margin-bottom: 15px;

    }

    .badge {

      display: inline-block;

      background: #1d4ed8;

      padding: 9px 16px;

      border-radius: 20px;

      font-weight: bold;

    }

    .layout {

      display: grid;

      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 24px;

      margin-top: 30px;

    }

    .layout[hidden] { display: none; }

    .photo img {
      display: block;
      max-width: 100%;
      max-height: 600px;
      height: auto;
      border-radius: 10px;
    }

    .panel {

      background: #020617;

      border: 1px solid #334155;

      border-radius: 18px;

      padding: 25px;

    }

    .photo {

      min-height: 300px;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #1e293b;

      border: 2px dashed #475569;

      border-radius: 14px;

      color: #94a3b8;

      text-align: center;

      padding: 20px;

    }

    .field {

      padding: 12px 0;

      border-bottom: 1px solid #1e293b;

    }

    .field strong {

      display: block;

      color: #93c5fd;

      margin-bottom: 6px;

    }

    .description {

      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;

    }

    @media (max-width: 700px) {

      .layout {

        grid-template-columns: minmax(0, 1fr);

      }

      h1 {

        font-size: 28px;

      }

    }

  </style>

</head>

<body>

  <header>

    <a class="logo" href="index.html">OneOfTwo</a>

  </header>

  <main>
    <a class="back" id="backLink" href="listings.html">← Back to categories</a>

    <h1 id="listingTitle" aria-live="polite">Loading listing...</h1>
    <p id="listingMessage" role="status"></p>

    <div class="layout" id="listingDetails" hidden>
      <section class="panel">
        <div class="photo" id="listingPhoto">No photo provided.</div>
      </section>

      <section class="panel">
        <span class="badge" id="listingStatus"></span>
        <p id="categoryName"></p>
        <h2>Item Details</h2>
        <div class="field" id="haveField" hidden>
          <strong>I have</strong>
          <span id="itemHave"></span>
        </div>
        <div class="field" id="wantedField" hidden>
          <strong>I am looking for</strong>
          <span id="itemWanted"></span>
        </div>
        <h2>Description</h2>
        <p class="description" id="itemDescription"></p>
        <p id="demoLabel" hidden><strong>DEMO LISTING</strong></p>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script src="listings-data.js"></script>
  <script>
    const { categoryName, fields, imageUrls, typeLabel } = OneOfTwoListings;
    const demos = {
      shoe: {
        title: "Single left sneaker",
        listing_type: "wanted",
        category: "fashion",
        have: "Left sneaker",
        wanted: "Matching right sneaker",
        description: "Looking for the matching right shoe."
      },
      glove: {
        title: "One black leather glove",
        listing_type: "available",
        category: "fashion",
        have: "One black leather glove",
        wanted: "Matching glove",
        description: "One glove available. Looking for its match."
      }
    };

    function showListing(item, demo = false) {
      document.title = item.title + " - OneOfTwo";
      document.getElementById("listingTitle").textContent = item.title;
      document.getElementById("listingStatus").textContent = typeLabel(item.listing_type);
      document.getElementById("itemDescription").textContent = item.description || "No description provided.";

      const categoryLabel = categoryName(item.category);
      if (categoryLabel) {
        document.getElementById("categoryName").textContent = categoryLabel;
        const backLink = document.getElementById("backLink");
        backLink.href = "listings.html?category=" + encodeURIComponent(item.category);
        backLink.textContent = "← Back to " + categoryLabel;
      }

      const have = demo ? item.have : (item.listing_type === "available" ? item.title : "");
      const wanted = demo ? item.wanted : (item.listing_type === "wanted" ? item.title : "");
      document.getElementById("itemHave").textContent = have;
      document.getElementById("itemWanted").textContent = wanted;
      document.getElementById("haveField").hidden = !have;
      document.getElementById("wantedField").hidden = !wanted;
      document.getElementById("demoLabel").hidden = !demo;
      document.getElementById("listingDetails").hidden = false;
    }

    async function showPhoto(client, item) {
      if (!item.image_path && !item.image_url) return;
      const container = document.getElementById("listingPhoto");
      container.textContent = "Loading photo...";
      const url = (await imageUrls(client, [item])).get(item.id);
      if (!url) {
        container.textContent = "Photo unavailable.";
        return;
      }

      const photo = document.createElement("img");
      photo.alt = item.title || "Listing photo";
      photo.referrerPolicy = "no-referrer";
      photo.addEventListener("error", () => {
        container.textContent = "Photo unavailable.";
      }, { once: true });
      photo.src = url;
      container.replaceChildren(photo);
    }

    function showUnavailable(title, message) {
      document.getElementById("listingTitle").textContent = title;
      document.getElementById("listingMessage").textContent = message;
    }

    async function loadListing() {
      const id = new URLSearchParams(location.search).get("id");
      if (Object.hasOwn(demos, id)) {
        showListing(demos[id], true);
        return;
      }

      if (!id || !/^[a-z0-9_-]{1,128}$/i.test(id)) {
        showUnavailable("Listing not found", "This listing does not exist or is no longer published.");
        return;
      }

      try {
        const client = OneOfTwoAuth.getClient();
        const { data, error } = await client
          .from("listings")
          .select(fields)
          .eq("id", id)
          .eq("publication_status", "published")
          .maybeSingle();

        if (error && error.code !== "22P02") throw error;
        if (!data) {
          showUnavailable("Listing not found", "This listing does not exist or is no longer published.");
          return;
        }

        showListing(data);
        await showPhoto(client, data);
      } catch (error) {
        console.error("Unable to load listing details.", error);
        showUnavailable("Unable to load listing", "Please try again.");
      }
    }

    loadListing();
  </script>

</body>

</html>
