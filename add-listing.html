

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title data-i18n="editor.pageTitle">Add a Listing | OneOfTwo</title>
  <script src="i18n.js"></script>
  <script src="i18n-listing.js"></script>
  <link rel="stylesheet" href="i18n.css">
 

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="auth.js"></script>
  <script defer src="listing-editor.js"></script>
  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f3f6fa;

      color: #17243a;

    }

    header {

      background: #14233e;

      color: white;

      padding: 22px;

      text-align: center;

    }

    header h1 { margin: 0; }

    header p {

      margin: 8px 0 0;

      opacity: 0.85;

    }

    main {

      max-width: 650px;

      margin: 35px auto;

      padding: 0 18px;

    }

    .panel {

      background: white;

      border-radius: 18px;

      padding: 28px;

      box-shadow: 0 8px 30px #14233e12;

    }

    h2 { margin-top: 0; }

    .choices {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;

      margin: 24px 0;

    }

    .choice { cursor: pointer; }

    .choice input {

      position: absolute;

      opacity: 0;

    }

    .choice span {

      display: block;

      text-align: center;

      padding: 24px 10px;

      border: 2px solid #d8e0eb;

      border-radius: 14px;

      font-weight: bold;

    }

    .choice input:checked + span {

      border-color: #168b77;

      background: #e8f8f3;

      color: #086b5a;

    }

    .choice input:focus-visible + span {

      outline: 3px solid #168b77;

      outline-offset: 3px;

    }

    label.field {

      display: block;

      margin: 18px 0;

      font-weight: bold;

    }

    input[type="text"], select, textarea {

      width: 100%;

      padding: 13px;

      margin-top: 8px;

      border: 1px solid #cbd5e1;

      border-radius: 9px;

      font: inherit;

    } 
    

select {

  font-size: 18px;

}

    .photo-field { margin: 18px 0; }
    .photo-field > .field { margin: 0; }

    .photo-picker {
      display: flex;
      align-items: center;
      position: relative;
      gap: 10px;
      margin-top: 4px;
      font-size: .8125rem;
      line-height: 1.35;
    }

    .photo-picker-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      border: 0;
      overflow: hidden;
      clip-path: inset(50%);
    }

    .photo-picker-button {
      display: inline-flex;
      align-items: center;
      flex: none;
      min-height: 44px;
      cursor: pointer;
    }

    .photo-picker-button span {
      padding: 5px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f1f5f9;
      color: #17243a;
      font-weight: 600;
    }

    .photo-picker-input:focus + .photo-picker-button span {
      outline: 2px solid #168b77;
      outline-offset: 2px;
    }

    .photo-picker-input:disabled + .photo-picker-button {
      cursor: not-allowed;
      opacity: .6;
    }

    .photo-file-name {
      min-width: 0;
      overflow-wrap: anywhere;
      color: #475569;
    }

    textarea {

      min-height: 110px;

      resize: vertical;

    }

    button {

      width: 100%;

      padding: 15px;

      border: 0;

      border-radius: 10px;

      background: #168b77;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }

    #preview {

      margin-top: 22px;

      padding: 18px;

      background: #f3f6fa;

      border-radius: 12px;

    }

    #preview img {
      display: block;
      max-width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: 10px;
    }

    #preview img[hidden] { display: none; }
    #previewTitle, #previewDescription { overflow-wrap: anywhere; }
    #previewDescription { white-space: pre-wrap; }
    button:disabled { opacity: 0.55; cursor: default; }

    .note {

      color: #627086;

      font-size: 13px;

      line-height: 1.5;

    }

    .back {

      display: block;

      margin-top: 22px;

      color: #168b77;

      text-align: center;

    }

    @media (max-width: 420px) {

      .panel { padding: 18px; }

      .choices { grid-template-columns: 1fr; }

    }

  </style>

</head>

<body class="add-listing-page">

  <header>

    <div data-language-switcher></div>
    <h1>OneOfTwo</h1>

    <p data-i18n="editor.tagline">Find the missing half</p>

  </header>

  <main>

    <section class="panel">

      <h2 data-i18n="editor.heading">Add a listing</h2>

      <p data-i18n="editor.intro">Every missing half deserves a chance.</p>
      

      <p id="authStatus" class="note" role="status" data-i18n="editor.checkingAuth">Checking sign-in status…</p>
      <p id="signInLink" hidden><a href="index.html#login" data-i18n="editor.loginLink">Log in to save or publish</a></p>

      <form id="listingForm">

        <p><strong data-i18n="editor.chooseType">What would you like to do?</strong></p>

        <div class="choices">

          <label class="choice">

            <input type="radio" name="type"

                   value="available" checked>

            <span>📦 <b data-i18n="listing.type.available">I HAVE</b></span>

          </label>

          <label class="choice">

            <input type="radio" name="type"

                   value="wanted">

            <span>🔎 <b data-i18n="listing.type.wanted">I'M LOOKING FOR</b></span>

          </label>

        </div>

        <label class="field">

          <span data-i18n="editor.itemName">Item name</span>

          <input type="text" id="itemTitle"

                 placeholder="e.g. Nike Air Max 90" data-i18n-placeholder="editor.itemPlaceholder"

                 maxlength="120" required>

        </label> 
        

<label class="field">

  <span data-i18n="editor.category">Category</span>

  <select id="itemCategory" required>

    <option value="" selected disabled data-i18n="editor.selectCategory">Select category</option>

    <option value="fashion" data-i18n="category.fashion">Fashion &amp; Shoes</option>

    <option value="jewellery" data-i18n="category.jewellery">Jewellery &amp; Watches</option>

    <option value="home" data-i18n="category.home">Home &amp; Living</option>

    <option value="automotive" data-i18n="category.automotive">Automotive</option>
    <option value="sports" data-i18n="category.sports">Sports &amp; Outdoors</option>

    <option value="electronics" data-i18n="category.electronics">Electronics</option>

    <option value="tools" data-i18n="category.tools">Tools &amp; Hardware</option>

    <option value="toys" data-i18n="category.toys">Toys &amp; Games</option>

    <option value="collectibles" data-i18n="category.collectibles">Collectibles &amp; Sets</option>

    <option value="lost" data-i18n="category.lost">Lost &amp; Found</option>

    <option value="parts" data-i18n="category.parts">Missing Parts</option>

  </select>

</label>

        <label class="field">

          <span data-i18n="editor.description">Description</span>

          <textarea id="itemDescription"

                    placeholder="Describe your item or the missing half..."
                    data-i18n-placeholder="editor.descriptionPlaceholder"></textarea>

        </label> 
        

        <div class="photo-field">
          <label class="field" id="photoFieldLabel" for="itemImage" data-i18n="editor.addPhoto">Add photo (optional)</label>
          <div class="photo-picker">
            <input type="file" id="itemImage" class="photo-picker-input"
                   accept="image/jpeg,image/png,image/webp"
                   aria-labelledby="photoPickerLabel" aria-describedby="photoFieldLabel photoFileName">
            <label id="photoPickerLabel" class="photo-picker-button" for="itemImage"><span data-i18n="editor.choosePhoto">Choose photo</span></label>
            <span class="photo-file-name" id="photoFileName" role="status" data-i18n="editor.noPhoto">No photo selected</span>
          </div>
        </div>

  

        <button type="submit" id="previewListingButton" data-i18n="editor.preview">Preview listing</button>
        

<button type="button" id="saveDraftButton" data-i18n="editor.saveDraft"

        style="margin-top: 12px;" disabled>

  Save as draft

</button>

<button type="button" id="publishListingButton" data-i18n="editor.publish"

        style="margin-top: 12px;" disabled>

  Publish listing

</button>

<p id="listingStatus" class="note" role="status"></p>
        <p id="listingResult" hidden><a id="listingResultLink"></a></p>
        <p id="newListingLink" hidden><a href="add-listing.html" data-i18n="editor.addAnother">Add another listing</a></p>
      </form>

      <div id="preview" hidden>

        <h3 data-i18n="editor.previewHeading">Your listing preview</h3>

        <p id="previewType"></p>
        <p id="previewCategory"></p>

        <h4 id="previewTitle"></h4>

        <p id="previewDescription"></p>
        <img id="previewPhoto" alt="" hidden>
      </div>

    </section>

    <a class="back" href="index.html" data-i18n="editor.backHome">

      Back to OneOfTwo

    </a>

  </main>

  <script>
    (() => {
      const photoInput = document.getElementById('itemImage');
      const photoFileName = document.getElementById('photoFileName');

      function updatePhotoFileName() {
        const name = photoInput.files[0]?.name;
        if (name) {
          delete photoFileName.dataset.i18n;
          photoFileName.textContent = name;
        } else {
          photoFileName.dataset.i18n = 'editor.noPhoto';
          window.OneOfTwoI18n.translate(photoFileName);
        }
      }

      photoInput.addEventListener('change', updatePhotoFileName);
      photoInput.form.addEventListener('reset', () => setTimeout(updatePhotoFileName, 0));
      window.addEventListener('pageshow', updatePhotoFileName);
    })();
  </script>

</body>

</html>
