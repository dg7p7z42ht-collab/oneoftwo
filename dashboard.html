
<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OneOfTwo Dashboard</title>

  <style>

    body {

      margin: 0;

      font-family: Arial, Helvetica, sans-serif;

      background: #0f172a;

      color: white;

      text-align: center;

      padding: 80px 20px;

    }

    .box {

      max-width: 600px;

      margin: auto;

      background: #020617;

      border: 1px solid #1e293b;

      border-radius: 20px;

      padding: 40px;

    }

    button {

      padding: 14px 28px;

      border-radius: 12px;

      border: none;

      font-weight: 700;

      cursor: pointer;

      background: #2563eb;

      color: white;

      margin-top: 20px;

    }

    a {

      color: #93c5fd;

    }

  </style>

</head>

<body>

  <div class="box">

    <h1>Welcome to OneOfTwo!</h1>
 

    <p id="userEmail" role="status">Checking your session…</p>
    <p id="logoutStatus" role="status"></p>
    <button id="retrySessionButton" type="button" hidden>Check again</button>
    

    <section id="drafts" hidden>
      <h2>Your drafts</h2>
      <p id="draftsStatus" role="status"></p>
      <ul id="draftsList"></ul>
      <p><a href="add-listing.html">Add Listing</a></p>
    </section>

    <button id="logoutButton" type="button" disabled>Log out</button>

    <p><a href="index.html">Back to homepage</a></p>

  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script defer src="auth.js"></script>
<script defer src="listing-drafts.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const userEmail = document.getElementById('userEmail');
  const logoutStatus = document.getElementById('logoutStatus');
  const logoutButton = document.getElementById('logoutButton');
  const retryButton = document.getElementById('retrySessionButton');
  let auth;
  let signingOut = false;

  async function checkSession() {
    logoutButton.disabled = true;
    retryButton.hidden = true;
    userEmail.textContent = 'Checking your session…';

    try {
      if (!auth) {
        auth = OneOfTwoAuth.getClient().auth;
        auth.onAuthStateChange(event => {
          if (event === 'SIGNED_OUT' && !signingOut) {
            window.location.replace('index.html#login');
          }
        });
      }

      const { data, error } = await auth.getSession();
      if (error) throw error;
      if (!data.session) {
        window.location.replace('index.html#login');
        return;
      }

      userEmail.textContent = 'You are logged in as: ' + data.session.user.email;
      loadListingDrafts(data.session.user.id);
      logoutButton.disabled = false;
    } catch (error) {
      userEmail.textContent = OneOfTwoAuth.errorMessage(
        error, 'Unable to check your session. Please try again.'
      );
      retryButton.hidden = false;
    }
  }

  retryButton.addEventListener('click', checkSession);
  window.addEventListener('pageshow', event => {
    if (event.persisted) checkSession();
  });

  logoutButton.addEventListener('click', async () => {
    if (signingOut || logoutButton.disabled) return;
    signingOut = true;
    logoutButton.disabled = true;
    logoutStatus.textContent = 'Signing out…';
    try {
      const { error } = await auth.signOut({ scope: 'local' });
      if (error) throw error;
      window.location.replace('index.html#login');
    } catch (error) {
      try {
        const { data, error: sessionError } = await auth.getSession();
        if (!sessionError && !data.session) {
          window.location.replace('index.html?auth_notice=signed_out_locally#login');
          return;
        }
      } catch {
        // Keep the retry available if the session state cannot be checked.
      }
      logoutStatus.textContent = OneOfTwoAuth.errorMessage(
        error, 'Unable to sign out. Please try again.'
      );
      logoutButton.disabled = false;
    } finally {
      signingOut = false;
    }
  });

  checkSession();
});
</script>
</body>

</html>
